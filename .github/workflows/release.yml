name: Release

# Publishing is a tag push, not a commit to main: `v0.1.0` and the version in
# package.json must agree before anything leaves the runner.
#
# A manual run does everything except publish and create the release, so the
# workflow can be rehearsed from a branch: Actions -> Release -> Run workflow,
# with `tag` set to the tag you intend to push. Only a real `v*` tag publishes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to check as if it had been pushed, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance (sigstore attestation)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tag matches package.json
        # Fails before the expensive steps: a tag that does not name the version
        # in package.json would publish under the wrong number or refuse to
        # publish at all, after check and build have already run.
        env:
          # Empty on a real tag push, where the tag is the ref that triggered us.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          echo "tag=${tag}"
          echo "package.json version=${version}"
          if [ "${tag}" != "${expected}" ]; then
            echo "::error::tag ${tag} does not match package.json version (expected ${expected})"
            exit 1
          fi

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: npm 11 for trusted publishing
        # Node 20 bundles npm 10, and npm's OIDC publishing needs 11.5.1 or
        # later. The NPM_TOKEN path works on npm 10 too; this keeps both open.
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Verify the published surface
        # Everything `files` ships, and the two entry points it must contain.
        # `--dry-run` produces the tarball without uploading it; provenance is
        # only attached by the real publish below.
        run: |
          set -euo pipefail
          npm publish --dry-run --access public
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q 'dist/index.js' /tmp/pack.txt
          grep -q 'dist/index.d.ts' /tmp/pack.txt
          grep -q 'LICENSE' /tmp/pack.txt
          grep -q 'README.md' /tmp/pack.txt

      - name: Publish to npm
        # A manual run stops here: only a tag push may upload.
        if: ${{ github.event_name == 'push' }}
        # NPM_TOKEN is a repository secret set by a maintainer. With npm trusted
        # publishing configured for this repository instead, no token is needed
        # and this env var is empty — npm then authenticates with the OIDC token
        # that `id-token: write` mints. Never commit a token.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: github release ${{ github.ref_name }}
    needs: publish
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Separate job so the publish step above never holds write access.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
